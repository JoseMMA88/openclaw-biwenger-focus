name: Auction automation tests

on:
  push:
    paths:
      - 'src/auctions/**'
      - 'scripts/auction-alert.mjs'
      - 'tests/**'
      - '.github/workflows/**'
      - 'package*.json'
      - 'tsconfig.json'
  pull_request:
    paths:
      - 'src/auctions/**'
      - 'scripts/auction-alert.mjs'
      - 'tests/**'
      - '.github/workflows/**'
      - 'package*.json'
      - 'tsconfig.json'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc -p tsconfig.json --noEmit
      - run: node --check scripts/auction-alert.mjs
