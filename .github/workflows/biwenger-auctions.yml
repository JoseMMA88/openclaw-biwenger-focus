name: Biwenger auction settings

on:
  workflow_dispatch:
    inputs:
      action:
        description: Auction switch state
        required: true
        type: choice
        options:
          - open
          - close
  schedule:
    - cron: '7 23 * * 4'
      timezone: Europe/Madrid
    - cron: '7 20 * * 0'
      timezone: Europe/Madrid

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: biwenger-auction-settings
  cancel-in-progress: false

jobs:
  update-auctions:
    runs-on: ubuntu-24.04
    environment: Secrets
    timeout-minutes: 10
    steps:
      - name: Resolve Madrid schedule
        id: schedule
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_ACTION: ${{ inputs.action }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "action=$MANUAL_ACTION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$EVENT_SCHEDULE" in
            '7 23 * * 4') action=open ;;
            '7 20 * * 0') action=close ;;
            *) echo "Unknown schedule: $EVENT_SCHEDULE" >&2; exit 1 ;;
          esac

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.schedule.outputs.should_run == 'true'
        run: npm ci

      - name: Update and verify auction settings
        id: update
        if: steps.schedule.outputs.should_run == 'true'
        env:
          BIWENGER_EMAIL: ${{ secrets.BIWENGER_EMAIL }}
          BIWENGER_PASSWORD: ${{ secrets.BIWENGER_PASSWORD }}
          BIWENGER_LEAGUE_ID: ${{ secrets.BIWENGER_LEAGUE_ID }}
          AUCTION_SCHEDULE: ${{ github.event.schedule }}
        run: npm run auctions:set -- "${{ steps.schedule.outputs.action }}"

      - name: Check supervisor availability
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/biwenger-auction-supervisor.yml" --jq '.state')
          if [[ "$state" != active ]]; then
            echo 'Auction supervisor is not active' >&2
            exit 1
          fi

      - name: Report or resolve primary incident
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUCTION_ALERT_KEY: primary
          AUCTION_ALERT_ASSIGNEE: JoseMMA88
          AUCTION_ALERT_STATE: ${{ job.status == 'success' && 'recovered' || 'failure' }}
          AUCTION_ALERT_MESSAGE: ${{ job.status == 'success' && 'El workflow principal ha aplicado y verificado los ajustes; supervisor activo.' || 'El workflow principal ha fallado. Revisar los logs y el estado de la liga antes del ciclo de las 07:00 de Madrid.' }}
        run: node scripts/auction-alert.mjs
