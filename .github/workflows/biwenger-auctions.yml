name: Biwenger auction settings

on:
  workflow_dispatch:
    inputs:
      action:
        description: Auction switch state
        required: true
        type: choice
        options:
          - open
          - close
  schedule:
    # Two idempotent attempts cover 23:07 Europe/Madrid in both CEST and CET.
    - cron: '7 21,22 * * 4'
    - cron: '7 21,22 * * 0'

permissions:
  contents: read

concurrency:
  group: biwenger-auction-settings
  cancel-in-progress: false

jobs:
  update-auctions:
    runs-on: ubuntu-latest
    environment: Secrets
    timeout-minutes: 10
    steps:
      - name: Resolve Madrid schedule
        id: schedule
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_ACTION: ${{ inputs.action }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "action=$MANUAL_ACTION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$EVENT_SCHEDULE" in
            '7 21,22 * * 4') action=open ;;
            '7 21,22 * * 0') action=close ;;
            *) echo "Unknown schedule: $EVENT_SCHEDULE" >&2; exit 1 ;;
          esac

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.schedule.outputs.should_run == 'true'
        run: npm ci

      - name: Update and verify auction settings
        if: steps.schedule.outputs.should_run == 'true'
        env:
          BIWENGER_EMAIL: ${{ secrets.BIWENGER_EMAIL }}
          BIWENGER_PASSWORD: ${{ secrets.BIWENGER_PASSWORD }}
          BIWENGER_LEAGUE_ID: ${{ secrets.BIWENGER_LEAGUE_ID }}
        run: npm run auctions:set -- "${{ steps.schedule.outputs.action }}"
